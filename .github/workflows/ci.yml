name: FLASH ROUTER CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  quality:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run verify:structure
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install chromium
      - run: npm run test:e2e
